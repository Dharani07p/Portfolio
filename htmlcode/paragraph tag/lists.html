
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in Html</title>
</head>
<body>
    <h1>Un Ordered List</h1>
    <h1>Ordered List</h1>
    <h1>Description / Definition List</h1>
    <ul>
        <li>Audi</li>
        <li>Chevrolet</li>
        <li>Bmw</li>
        <li>Ferrari</li>
        <ol>
            <li>Porsche</li>
            <li>Rolls Royce</li>
            <li>suzuki</li>
            <li>tesla</li>
        </ol>
    </ul>
    <ol>
        <li>Audi</li>
        <li>Chevrolet</li>
        <li>Bmw</li>
        <li>Ferrari</li>           
    </ol>

    <dl>
        <dt>--cars</dt>
        <dd>Audi</dd>
        <dd>Chevrolet</dd>
        <dd>Bmw</dd>
        <dd>Ferrari</dd>
    </dl>

</body>
</html>
