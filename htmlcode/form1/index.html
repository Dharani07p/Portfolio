
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Form</title>
</head>

<body>
    <h1>HTML FORM</h1>
    <form>
        <div>
            <label>Enter Your Name : </label>
            <input type="text" placeholder="Enter Name">
        </div>

        <div>
            <label>Enter Your Age : </label>
            <input type="number">
        </div>

        <div>
            <label>Enter Your Email :</label>
            <input type="email" placeholder="Enter EmailId">
        </div>

        <div>
            <label>Select Your Gender :</label>
        </div>

        <div>
            <input type="radio" name="gender">
            <label>Male</label>

            <input type="radio" name="gender">
            <label>FeMale</label>

            <input type="radio" name="gender">
            <label>Others</label>
        </div>

        <label>Do you have any vehicle?</label>
        <div>
            <label>
                <input type="checkbox">
                Bike
            </label>
            <label>
                <input type="checkbox">
                Cycle
            </label>
            <label>
                <input type="checkbox">
                Car
            </label>
        </div>

        <div>
            <label>Select Your Car Brand : </label>
            <select>
                <option>--Select Any One--</option>
                <option>BMW</option>
                <option>Ferrari</option>
                <option>Toyoto</option>
                <option>Tata</option>
            </select>
        </div>

        <div>
            <label>Enter Your Feedback : </label><br>
            <textarea cols="40" rows="7" placeholder="Give me a feedback about my form"></textarea>
        </div>
        <button>Submit</button>
    </form> 
    <h1>Input Types</h1>

    <form action="formValidation.java" method="get">
        <fieldset>
        <legend>MY FORM</legend>
        <input type="text" value="" placeholder="Enter Name">
        <input type="password" required autofocus>

        <input list="browsers" placeholder="Select Browser">
        <datalist id="browsers" >
          <option value="Opera">
          <option value="Firefox">
          <option value="Chrome">
          <option value="Edge">
        </datalist>
        <input type="text" autocomplete="on">
        <button type="submit">Submit</button>
    </fieldset>
    </form>



</body>

</html>
